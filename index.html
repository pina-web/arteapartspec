<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>아파트 상담 자료실</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#ffffff; --ink:#1b2230; --sub:#5d6675; --mute:#8c94a1; --line:#e4e7ec; --soft:#f4f6f9;
  --accent:#1f5bd6; --accent-soft:#e8effd; --marker:#ffec8a; --danger:#d23b3b;
  --r:10px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);
  font-family:Pretendard,"Pretendard Variable","Malgun Gothic","Apple SD Gothic Neo",sans-serif;font-size:14px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:300px 1fr;height:100%}

/* sidebar */
.side{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:#fff}
.brand{padding:20px 18px 12px}
.brand h1{font-size:18px;margin:0;font-weight:800;letter-spacing:-.02em}
.brand p{margin:2px 0 0;color:var(--mute);font-size:12px}
.conn{margin:0 18px 12px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);font-size:12.5px;color:var(--sub);display:flex;gap:8px;align-items:center;justify-content:space-between}
.conn.dirty{border-color:#f0c24b;background:#fffbea}
.conn b{color:var(--ink);font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.dot{width:8px;height:8px;border-radius:50%;background:#c3c8d0;flex:none}
.dot.on{background:#20a35a}
.search{margin:0 18px 10px;position:relative}
.search input{width:100%;height:38px;border:1px solid var(--line);border-radius:var(--r);padding:0 12px 0 34px;background:#fff}
.search svg{position:absolute;left:11px;top:11px;color:var(--mute)}
.tree{flex:1;overflow:auto;padding:4px 10px 16px}
.rg{margin-bottom:2px}
.rg>button,.sr>button{width:100%;display:flex;align-items:center;gap:6px;background:none;border:0;padding:7px 8px;border-radius:8px;text-align:left}
.rg>button{font-weight:700;font-size:14px}
.rg>button:hover,.sr>button:hover{background:var(--soft)}
.chev{width:14px;transition:transform .15s;color:var(--mute);flex:none}
.open>button .chev{transform:rotate(90deg)}
.cnt{margin-left:auto;color:var(--mute);font-size:12px;font-weight:500}
.sr{margin-left:14px}
.sr>button{font-size:13.5px;color:var(--sub);font-weight:600}
.kids{display:none}
.open>.kids{display:block}
.apt{display:block;width:100%;text-align:left;background:none;border:0;padding:6px 8px 6px 34px;border-radius:8px;font-size:13.5px}
.apt:hover{background:var(--soft)}
.apt.sel{background:var(--accent-soft);color:var(--accent);font-weight:700}
.apt small{color:var(--mute);font-size:11px;margin-left:4px}
.side-foot{border-top:1px solid var(--line);padding:12px 18px;display:flex;gap:8px}
.btn{height:36px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px}
.btn.ghost{border-color:transparent}
.btn.danger{color:var(--danger)}
.btn[disabled]{opacity:.45;pointer-events:none}

/* main */
.main{overflow:auto;min-width:0}
.wrap{max-width:1280px;margin:0 auto;padding:26px 34px 60px}
.crumb{color:var(--mute);font-size:13px}
.title-row{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:2px 0 14px}
.title-row h2{font-size:30px;margin:0;font-weight:800;letter-spacing:-.03em}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--sub);font-size:13px;padding-bottom:6px}
.facts span b{color:var(--ink);font-weight:600;margin-left:4px}
.notice{display:flex;gap:10px;align-items:flex-start;margin:0 0 20px;font-size:14.5px;font-weight:600;line-height:1.6}
.notice mark{background:linear-gradient(transparent 38%,var(--marker) 38%);padding:0 2px;color:var(--ink);box-decoration-break:clone;-webkit-box-decoration-break:clone}
.notice .ico{flex:none;margin-top:3px;color:#c58a00}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;position:sticky;top:0;background:#fff;z-index:5;padding-top:6px}
.tab{background:none;border:0;padding:10px 16px;font-weight:700;font-size:15px;color:var(--mute);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--ink);border-color:var(--ink)}
.tab{white-space:nowrap;flex:none}
.tab-tools{flex:none}
.tab i{font-style:normal;font-weight:500;font-size:12.5px;margin-left:4px}
.tab-tools{margin-left:auto;display:flex;gap:6px;align-items:center}

.types{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.type{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 16px 7px 12px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
.type .sw{width:12px;height:12px;border-radius:4px}
.type small{font-weight:500;color:var(--mute);font-size:12px}
.type.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.grp{font-size:13px;font-weight:700;color:var(--sub);margin:18px 0 10px;display:flex;align-items:center;gap:8px}
.grp::after{content:"";flex:1;height:1px;background:var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;display:flex;flex-direction:column}
.thumb{aspect-ratio:16/9;background:var(--soft);display:block;width:100%;border:0;padding:0;cursor:zoom-in;position:relative}
.thumb img{width:100%;height:100%;object-fit:contain;display:block;background:#fff}
.card-b{display:flex;align-items:center;gap:8px;padding:10px 10px 10px 14px;border-top:1px solid var(--line)}
.card-b .lb{flex:1;min-width:0;font-weight:600;font-size:13.5px;line-height:1.35}
.card-b .lb small{display:block;color:var(--mute);font-weight:500;font-size:11.5px}
.copy{height:32px;padding:0 12px;border-radius:8px;border:0;background:var(--ink);color:#fff;font-weight:700;font-size:12.5px;display:inline-flex;align-items:center;gap:5px;flex:none}
.copy:hover{background:#000}
.pptb{height:32px;padding:0 10px;border-radius:8px;border:1px solid #e3a58a;background:#fff4ee;color:#b5461a;font-weight:800;font-size:12px;flex:none}
.pptb:hover{background:#ffe6d9}
.pptb[disabled]{opacity:.5}
.copy.done{background:#20a35a}
.more{width:30px;height:32px;border:0;background:none;border-radius:8px;color:var(--mute);flex:none}
.more:hover{background:var(--soft);color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--sub)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}

.feat{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:16px}
.fs{border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.fs-h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.fs-h h3{margin:0;font-size:15.5px;font-weight:800;flex:1}
.fs pre{margin:0;white-space:pre-wrap;font-family:inherit;font-size:14px;line-height:1.7;color:#2b3240}
.fs input.t{width:100%;font-weight:800;font-size:15px;border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.fs textarea{width:100%;min-height:160px;border:1px solid var(--line);border-radius:8px;padding:10px;resize:vertical;line-height:1.6;font-size:14px}
.editbox{border:1px dashed #c9cfd8;border-radius:12px;padding:16px 18px;margin-bottom:16px;display:grid;gap:10px}
.editbox label{font-size:12.5px;font-weight:700;color:var(--sub)}
.editbox input,.editbox textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px}

.empty{max-width:560px;margin:12vh auto;text-align:left;padding:0 24px}
.empty h2{font-size:26px;margin:0 0 10px;letter-spacing:-.03em}
.empty p{color:var(--sub);margin:0 0 8px;line-height:1.7}
.empty .row{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}
.empty code{background:var(--soft);padding:1px 6px;border-radius:5px;font-size:12.5px}
.tree-ex{margin:14px 0;padding:12px 16px;border:1px solid var(--line);border-radius:10px;font-size:13px;color:var(--sub);line-height:1.8}
.nodata{color:var(--mute);padding:30px 0}
.loadbox{border:1px solid var(--line);border-radius:12px;padding:34px 24px;text-align:center;color:var(--sub);margin-top:6px}
.loadbox b{display:block;color:var(--ink);font-size:15.5px;margin-bottom:6px}
.loadbox p{margin:0;font-size:13.5px}
.loadbox code{background:var(--soft);padding:1px 6px;border-radius:5px}
.loadbox.err{border-color:#f0c9c9;background:#fffafa}
.loadbox .btn{margin-top:14px}
.spin{display:inline-block;width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;margin-bottom:12px}
@keyframes sp{to{transform:rotate(360deg)}}
.files-note{margin-top:16px;color:var(--sub);font-size:13px}

/* lightbox (white) */
.lb-wrap{position:fixed;inset:0;background:#fff;z-index:50;display:none;flex-direction:column}
.lb-wrap.on{display:flex}
.lb-top{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line)}
.lb-top .t{flex:1;font-weight:700;font-size:15px}
.lb-top .t small{color:var(--mute);font-weight:500;margin-left:6px}
.lb-img{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:16px;position:relative}
.lb-img img{max-width:100%;max-height:100%;object-fit:contain;box-shadow:0 0 0 1px var(--line)}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:22px}
.lb-nav.l{left:16px}.lb-nav.r{right:16px}

/* modal */
.mo{position:fixed;inset:0;background:rgba(27,34,48,.28);z-index:60;display:none;align-items:center;justify-content:center;padding:20px}
.mo.on{display:flex}
.mo-box{background:#fff;border-radius:14px;width:min(460px,100%);padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.18)}
.mo-box h3{margin:0 0 14px;font-size:17px}
.mo-box .f{display:grid;gap:4px;margin-bottom:12px}
.mo-box label{font-size:12.5px;font-weight:700;color:var(--sub)}
.mo-box input,.mo-box select{height:38px;border:1px solid var(--line);border-radius:8px;padding:0 10px;width:100%;background:#fff}
.mo-box .seg{display:flex;gap:6px}
.mo-box .seg button{flex:1;height:38px;border:1px solid var(--line);border-radius:8px;background:#fff;font-weight:700}
.mo-box .seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.mo-box .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.mo-box .hint{font-size:12.5px;color:var(--mute);margin:-4px 0 10px}
.menu{position:fixed;z-index:70;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.12);padding:4px;display:none;min-width:150px}
.menu.on{display:block}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 12px;border-radius:7px;font-size:13.5px}
.menu button:hover{background:var(--soft)}
.menu button.danger{color:var(--danger)}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;font-weight:600;font-size:13.5px;opacity:0;transition:.2s;z-index:80;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
.drop{position:fixed;inset:0;z-index:55;display:none;align-items:center;justify-content:center;background:rgba(31,91,214,.06);border:3px dashed var(--accent);font-size:20px;font-weight:800;color:var(--accent)}
.drop.on{display:flex}
.menu-btn{display:none}
.navbar{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.back{height:34px;padding:0 14px 0 11px;border-radius:9px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.back:hover{background:var(--soft);border-color:#cfd4dc}
.tab-back{border:0;background:none;width:36px;height:36px;border-radius:8px;font-size:18px;font-weight:700;color:var(--sub);align-self:center;margin-right:2px}
.tab-back:hover{background:var(--soft);color:var(--ink)}
.side-close{display:none;margin-top:10px}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:300px;z-index:40;transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.15)}
  .side.on{transform:none}
  .menu-btn{display:inline-flex}
  .side-close{display:inline-flex}
  .tabs{overflow-x:auto;scrollbar-width:none}
  .tab{padding:10px 12px}
  .wrap{padding:18px 16px 50px}
  .feat{grid-template-columns:1fr}
  .grid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.opt{display:inline-block;background:#6b3fd4;color:#fff;font-size:11px;font-weight:800;padding:1px 7px;border-radius:5px;margin-right:6px;vertical-align:1px;letter-spacing:.02em}
.opt-s{color:#6b3fd4!important;font-weight:700!important;margin-left:6px}
.card.is-opt{border-color:#cdbdf3}
.card.missing{border-color:#f0c9c9;background:#fffafa}
.card.missing .thumb{background:#fff5f5}
.card.is-opt .card-b{background:#f7f3ff}
.grp-opt{color:#6b3fd4}.grp-opt::after{background:#d9ccf6}
.fs.is-opt{border-color:#cdbdf3;background:#fbf9ff}
.ck{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--sub);white-space:nowrap;margin:2px 0 8px}
.ck input{width:16px;height:16px;accent-color:#6b3fd4}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand">
      <h1>아파트 상담 자료실</h1>
      <p>쉐어포인트 자료 폴더 연결형</p>
      <button class="btn sm side-close">← 닫기</button>
    </div>
    <div class="conn" id="conn"></div>
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="아파트명, 특징 검색">
    </div>
    <nav class="tree" id="tree"></nav>
    <div class="side-foot">
      <button class="btn pri" id="btnAddApt" style="flex:1">＋ 아파트 추가</button>
      
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>

<div class="lb-wrap" id="lb">
  <div class="lb-top">
    <button class="back" id="lbBack2" onclick="closeLB()">←</button>
    <div class="t" id="lbT"></div>
    <button class="btn sm" id="lbPpt">PPT 받기 (도형 편집)</button>
    <button class="copy" id="lbCopy">이미지 복사</button>
    <button class="btn sm" id="lbSave">다운로드</button>
    <button class="back" id="lbClose">← 뒤로 (Esc)</button>
  </div>
  <div class="lb-img">
    <button class="lb-nav l" id="lbPrev" aria-label="이전">‹</button>
    <img id="lbImg" alt="">
    <button class="lb-nav r" id="lbNext" aria-label="다음">›</button>
  </div>
</div>
<div class="mo" id="mo"><div class="mo-box" id="moBox"></div></div>
<div class="menu" id="menu"></div>
<div class="toast" id="toast"></div>
<div class="drop" id="drop">여기에 놓으면 WebP로 변환해 추가합니다</div>
<input type="file" id="imgInput" accept="image/*" multiple hidden>

<script>
/* ===== 쉐어포인트 동기화 폴더를 직접 읽고 쓰는 저장소 계층 ===== */
const FSOK='showDirectoryPicker' in window;
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('apt-lib-fs',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function kvSet(k,v){try{const db=await idb();db.transaction('kv','readwrite').objectStore('kv').put(v,k)}catch(e){}}
async function kvGet(k){try{const db=await idb();return await new Promise(r=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}catch(e){return null}}
async function getDir(h,path,create){let d=h;for(const p of String(path).split('/').filter(Boolean))d=await d.getDirectoryHandle(p,{create:!!create});return d}
async function readFileAt(path){
  try{const parts=String(path).split('/');const nm=parts.pop();const d=await getDir(S.root,parts.join('/'),false);return await (await d.getFileHandle(nm)).getFile()}catch(e){return null}
}
async function writeFileAt(path,blob){
  const parts=String(path).split('/');const nm=parts.pop();const d=await getDir(S.root,parts.join('/'),true);
  const fh=await d.getFileHandle(nm,{create:true});const w=await fh.createWritable();await w.write(blob);await w.close();
}
async function removeFileAt(path){try{const parts=String(path).split('/');const nm=parts.pop();const d=await getDir(S.root,parts.join('/'),false);await d.removeEntry(nm)}catch(e){}}
async function readJSON(path){const f=await readFileAt(path);if(!f)return null;try{return JSON.parse(await f.text())}catch(e){return null}}
async function writeJSON(path,obj){await writeFileAt(path,new Blob([JSON.stringify(obj,null,1)],{type:'application/json'}))}
const aptPath=(a,rel)=>'자료/'+a.dir+(rel?'/'+rel:'');

/* 아파트 자료 읽기 */
async function loadApt(a){
  if(a.info)return true;
  const i=await readJSON(aptPath(a,'info.json'));
  if(!i)return false;
  i.types=i.types||[];i.images=i.images||[];i.features=i.features||[];i.facts=i.facts||[];
  a.info=i;return true;
}
/* 색인 갱신 */
function idxOf(a){
  const i=a.info;
  return {region:a.region,sub:a.sub,name:a.name,dir:a.dir,opt:hasOpt(a),notice:i.notice||'',facts:i.facts||[],
    types:(i.types||[]).map(t=>({name:t.name,households:t.households||0,n:t.plans.length})),nI:(i.images||[]).length};
}
function searchTextOf(a){const i=a.info;return [a.name,a.region,a.sub,i.notice,...(i.facts||[]).map(f=>f.label+' '+f.value),...(i.features||[]).map(f=>f.title+' '+f.text),...(i.types||[]).map(t=>t.name)].join(' ')}
let saveT=null,saving=0;
function markDirty(){
  const a=S.cur;if(!a||!a.info)return;
  Object.assign(a,idxOf(a));S.search[a.dir]=searchTextOf(a);
  S.dirty=true;renderConn();
  clearTimeout(saveT);saveT=setTimeout(()=>saveAll(a),700);
}
async function saveAll(a){
  if(!S.root)return;
  saving=1;renderConn();
  try{
    if(a&&a.info)await writeJSON(aptPath(a,'info.json'),a.info);
    await writeJSON('목록.json',{version:1,updated:new Date().toISOString().slice(0,10),
      apts:S.apts.map(x=>({region:x.region,sub:x.sub,name:x.name,dir:x.dir,opt:!!x.opt,notice:x.notice||'',facts:x.facts||[],types:x.types||[],nI:x.nI||0}))});
    if(S.searchLoaded)await writeJSON('검색.json',S.search);
    S.dirty=false;
  }catch(e){toast('저장하지 못했습니다: '+e.message)}
  saving=0;renderConn();
}
/* 폴더 연결 */
async function pickFolder(){
  if(!FSOK){toast('엣지 또는 크롬에서 열어 주세요');return}
  try{const h=await window.showDirectoryPicker({id:'apt-lib',mode:'readwrite'});await kvSet('root',h);await useRoot(h)}
  catch(e){if(e.name!=='AbortError')toast('폴더를 열지 못했습니다: '+e.message)}
}
async function useRoot(h){
  let p=await h.queryPermission({mode:'readwrite'});
  if(p!=='granted')p=await h.requestPermission({mode:'readwrite'});
  if(p!=='granted'){toast('폴더 권한이 필요합니다');return false}
  S.root=h;S.rootName=h.name;
  const idx=await readJSON('목록.json');
  if(!idx){S.apts=[];S.noIndex=true}
  else{S.noIndex=false;S.apts=idx.apts.map(x=>({...x}));S.updated=idx.updated||''}
  S.searchLoaded=false;S.search={};
  S.apts.forEach(x=>{openState[x.region]=true;if(S.apts.length<=60)openState[x.region+'/'+x.sub]=true});
  S.cur=null;renderConn();renderTree();renderMain();
  return true;
}
async function ensureSearch(){
  if(S.searchLoaded)return;
  const s=await readJSON('검색.json');S.search=s||{};S.searchLoaded=true;
}

/* ---------- constants ---------- */
const REGIONS=['서울','경기','인천','강원','충북','충남','대전','세종','전북','전남','광주','경북','경남','대구','울산','부산','제주'];
const TYPE_COLORS=['#8fc1e8','#f0bf7d','#eca3b6','#a5d6a0','#c3b1e6','#f2dc7c','#9fd6d2','#d9b8a0'];
const IMG_CATS=['단지','세대 사진','시공 예시','제품','행사·공지','기타'];

/* ---------- state ---------- */
const S={apts:[],cur:null,tab:'plans',type:null,pf:'all',cat:'전체',q:'',edit:false,lbList:[],lbIdx:0,dirty:false,root:null,rootName:'',search:{},searchLoaded:false,urls:[],updated:''};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const keyOf=a=>[a.region,a.sub,a.name].join('/');
const isOpt=it=>!!(it.option||/옵션/.test(it.group||''));
const hasOpt=a=>a.info?((a.info.types||[]).some(t=>t.plans.some(isOpt))||(a.info.images||[]).some(isOpt)||(a.info.features||[]).some(f=>f.option)):!!a.opt;
const OPT='<span class="opt">옵션</span>';
const openState={};

let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2000)}
addEventListener('beforeunload',e=>{if(S.dirty){e.preventDefault();e.returnValue=''}});

/* ---------- status box ---------- */
function renderConn(){
  const c=$('#conn');c.classList.toggle('dirty',!!S.dirty);
  if(!S.root){c.innerHTML=`<span class="dot"></span><div style="flex:1;min-width:0">폴더 미연결<b>자료 폴더를 연결하세요</b></div><button class="btn sm pri" id="cBtn">연결</button>`;}
  else{
    const n=S.apts.length,nr=new Set(S.apts.map(a=>a.region)).size;
    c.innerHTML=saving?`<span class="dot" style="background:#e0a100"></span><div style="flex:1;min-width:0">저장 중…<b>${esc(S.rootName)}</b></div>`
     :`<span class="dot on"></span><div style="flex:1;min-width:0">${nr}개 지역 · 아파트 ${n}곳<b>${esc(S.rootName)}</b></div><button class="btn sm" id="cBtn">변경</button>`;
  }
  const b=$('#cBtn');if(b)b.onclick=pickFolder;
}

/* ---------- tree ---------- */
function aptText(a){return S.search[a.dir]||[a.name,a.region,a.sub,a.notice||'',...(a.facts||[]).map(f=>f.label+' '+f.value),...(a.types||[]).map(t=>t.name)].join(' ')}
function renderTree(){
  const q=S.q.trim().toLowerCase();
  const list=S.apts.filter(a=>!q||aptText(a).toLowerCase().includes(q));
  const tr={};
  for(const a of list){((tr[a.region]||(tr[a.region]={}))[a.sub]||(tr[a.region][a.sub]=[])).push(a)}
  const regs=Object.keys(tr).sort((a,b)=>{const ia=REGIONS.indexOf(a),ib=REGIONS.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib)||a.localeCompare(b,'ko')});
  if(!regs.length){$('#tree').innerHTML=`<p style="padding:10px;color:var(--mute);font-size:13px">${S.apts.length?'검색 결과가 없습니다.':'아직 등록된 아파트가 없습니다.'}</p>`;return}
  const chev='<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m9 6 6 6-6 6"/></svg>';
  const aptBtn=a=>`<button class="apt ${S.cur===a?'sel':''}" data-k="${esc(keyOf(a))}">${esc(a.name)}${hasOpt(a)?'<small class="opt-s">옵션</small>':''}</button>`;
  $('#tree').innerHTML=regs.map(r=>{
    const subs=Object.keys(tr[r]).sort((a,b)=>a.localeCompare(b,'ko'));const n=subs.reduce((s,k)=>s+tr[r][k].length,0);
    const ro=q||openState[r]||(S.cur&&S.cur.region===r);
    return `<div class="rg ${ro?'open':''}" data-o="${esc(r)}"><button>${chev}${esc(r)}<span class="cnt">${n}</span></button><div class="kids">`+
      subs.map(s=>{
        const as=tr[r][s].sort((a,b)=>a.name.localeCompare(b.name,'ko'));
        if(!s)return as.map(aptBtn).join('');
        const k=r+'/'+s;const so=q||openState[k]||(S.cur&&S.cur.region===r&&S.cur.sub===s);
        return `<div class="sr ${so?'open':''}" data-o="${esc(k)}"><button>${chev}${esc(s)}<span class="cnt">${as.length}</span></button><div class="kids">${as.map(aptBtn).join('')}</div></div>`;
      }).join('')+`</div></div>`;
  }).join('');
}
$('#tree').addEventListener('click',e=>{
  const ab=e.target.closest('.apt');
  if(ab){const a=S.apts.find(x=>keyOf(x)===ab.dataset.k);if(a)openApt(a);$('#side').classList.remove('on');return}
  const hb=e.target.closest('.rg>button,.sr>button');
  if(hb){const box=hb.parentElement;box.classList.toggle('open');openState[box.dataset.o]=box.classList.contains('open')}
});
let qt;$('#q').addEventListener('input',e=>{clearTimeout(qt);qt=setTimeout(async()=>{S.q=e.target.value;if(S.q.trim()&&!S.searchLoaded){await ensureSearch()}renderTree()},140)});

/* ---------- open apartment ---------- */
async function openApt(a,noPush){
  revokeUrls();
  S.cur=a;S.edit=false;S.cat='전체';S.pf='all';S.loadFail=null;
  S.type=a.info?.types?.[0]?.name||null;
  renderTree();renderMain();$('#main').scrollTop=0;
  if(!noPush)pushNav();
  if(!a.info){
    const ok=await loadApt(a);
    if(S.cur!==a)return;
    if(!ok){S.loadFail=a.dir;renderMain();return}
    S.type=a.info.types?.[0]?.name||null;renderTree();renderMain();
  }
}
/* ---------- 뒤로가기 (브라우저 뒤로 버튼·마우스 뒤로 버튼·화면 버튼 모두 지원) ---------- */
const navState=()=>({k:S.cur?keyOf(S.cur):null,tab:S.tab,type:S.type,d:(history.state?.d||0)+1});
function pushNav(){try{history.pushState(navState(),'')}catch(e){}}
function goBack(){
  if($('#lb').classList.contains('on')){closeLB();return}
  if($('#mo').classList.contains('on')){closeModal();return}
  if((history.state?.d||0)>0)history.back();else goHome();
}
function goHome(){S.cur=null;S.edit=false;renderTree();renderMain();pushNav();if(innerWidth<=860)$('#side').classList.add('on')}
addEventListener('popstate',e=>{
  const st=e.state||{};
  $('#lb').classList.remove('on');closeModal();hideMenu();
  if(S.edit&&!confirm('편집 중인 내용이 적용되지 않았습니다. 뒤로 갈까요?')){pushNav();return}
  S.edit=false;
  const a=st.k?S.apts.find(x=>keyOf(x)===st.k):null;
  if(a===S.cur&&a&&(st.tab||'plans')===S.tab&&(st.type||S.type)===S.type)return;
  S.cur=a||null;
  if(a){S.tab=st.tab||'plans';S.type=st.type||a.info?.types?.[0]?.name||null}
  renderTree();renderMain();
  if(a&&!a.info)openApt(a,true);
});
try{if(!history.state)history.replaceState({k:null,d:0},'')}catch(e){}
const URLC=new Map();
function revokeUrls(){S.urls.forEach(u=>URL.revokeObjectURL(u));S.urls=[];URLC.clear()}
const src=(a,rel)=>URLC.get(a.dir+'/'+rel)||'';
async function urlFor(a,rel){
  const k=a.dir+'/'+rel;if(URLC.has(k))return URLC.get(k);
  const f=await readFileAt(aptPath(a,rel));if(!f)return '';
  const u=URL.createObjectURL(f);URLC.set(k,u);S.urls.push(u);return u;
}
async function blobOf(a,rel){return await readFileAt(aptPath(a,rel))}
async function fillImgs(root,apt){
  for(const img of root.querySelectorAll('img[data-f]')){
    const u=await urlFor(apt,img.dataset.f);
    if(u)img.src=u;else{img.alt='파일 없음';img.closest('.card')?.classList.add('missing')}
  }
}

/* ---------- main render ---------- */
function typeColor(apt,name){const i=(apt.info.types||[]).findIndex(t=>t.name===name);return TYPE_COLORS[(i<0?0:i)%TYPE_COLORS.length]}
function renderMain(){
  const m=$('#main');const a=S.cur;
  if(!a){m.innerHTML=emptyView();m.querySelectorAll('[data-back]').forEach(b=>b.onclick=goBack);
    const ec=$('#eConnect');if(ec)ec.onclick=pickFolder;
    const a2=$('#btnAddApt2');if(a2)a2.onclick=()=>$('#btnAddApt').click();
    return}
  const i=a.info||{notice:a.notice||'',facts:a.facts||[],types:a.types||[],images:[],features:[]};
  const crumb=[a.region,a.sub].filter(Boolean).map(esc).join(' › ');
  let h=`<div class="wrap"><div class="navbar"><button class="back" data-back>← 뒤로</button><button class="btn sm ghost" id="btnHome">처음 화면</button><button class="btn sm menu-btn" onclick="document.getElementById('side').classList.add('on')">☰ 아파트 목록</button></div>
  <div class="crumb">${crumb} <button class="btn sm ghost" id="btnAptMenu" style="margin-left:4px">아파트 편집</button></div>
  <div class="title-row"><h2>${esc(a.name)}</h2>
    <div class="facts">${(i.facts||[]).map(f=>`<span>${esc(f.label)}<b>${esc(f.value)}</b></span>`).join('')}</div></div>`;
  if(i.notice)h+=`<div class="notice"><svg class="ico" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 1 21h22L12 2zm1 15h-2v-2h2v2zm0-4h-2V9h2v4z"/></svg><mark>${esc(i.notice)}</mark></div>`;
  if(!a.info){
    h+=S.loadFail===a.dir
      ?`<div class="loadbox err"><b>자료를 찾지 못했습니다.</b><p>폴더 <code>자료/${esc(a.dir)}/info.json</code> 이 없습니다.</p><button class="btn" id="btnRetry">다시 시도</button></div>`
      :`<div class="loadbox"><span class="spin"></span><b>자료를 불러오는 중…</b><p>도면 ${(a.types||[]).reduce((s,t)=>s+(t.n||0),0)}장 · 이미지 ${a.nI||0}장</p></div>`;
    h+='</div>';m.innerHTML=h;
    m.querySelectorAll('[data-back]').forEach(b=>b.onclick=goBack);
    const hb2=$('#btnHome');if(hb2)hb2.onclick=goHome;
    const rb=$('#btnRetry');if(rb)rb.onclick=()=>{S.loadFail=null;renderMain();openApt(a,true)};
    return;
  }
  const nP=(i.types||[]).reduce((s,t)=>s+(t.plans||[]).length,0),nI=(i.images||[]).length;
  h+=`<div class="tabs"><button class="tab-back" data-back title="뒤로" aria-label="뒤로">←</button>
    <button class="tab ${S.tab==='plans'?'on':''}" data-t="plans">평면도<i>${nP}</i></button>
    <button class="tab ${S.tab==='images'?'on':''}" data-t="images">이미지<i>${nI}</i></button>
    <button class="tab ${S.tab==='feat'?'on':''}" data-t="feat">특징</button>
    <div class="tab-tools">${S.tab==='plans'&&(i.decks||[]).length?`<button class="btn sm" id="btnDeck">도면 PPT 전체 받기</button>`:''}${S.tab!=='feat'?`<button class="btn sm" id="btnAddImg">＋ 이미지 추가</button>`:''}</div>
  </div><div id="tabBody"></div></div>`;
  m.innerHTML=h;
  m.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{if(S.tab===b.dataset.t)return;S.tab=b.dataset.t;S.edit=false;renderMain();pushNav()});
  m.querySelectorAll('[data-back]').forEach(b=>b.onclick=goBack);
  const hb=$('#btnHome');if(hb)hb.onclick=goHome;
  const ai=$('#btnAddImg');if(ai)ai.onclick=()=>$('#imgInput').click();
  const bd=$('#btnDeck');if(bd)bd.onclick=e=>{const ds=i.decks;if(ds.length===1)downloadDeck(a,ds[0]);else showMenu(e.currentTarget,ds.map(d=>[d.label+' (PPT)',()=>downloadDeck(a,d)]))};
  $('#btnAptMenu').onclick=e=>showMenu(e.currentTarget,[['지역·이름 수정',()=>editApt(a)],['이 아파트 삭제',()=>delApt(a),'danger']]);
  if(S.tab==='plans')renderPlans(a);else if(S.tab==='images')renderImages(a);else renderFeat(a);
}

function cardHTML(a,item,idx,sub){
  return `<div class="card${isOpt(item)?' is-opt':''}"><button class="thumb" data-i="${idx}"><img alt="${esc(item.label)}" data-f="${esc(item.file)}" loading="lazy" decoding="async"></button>
   <div class="card-b"><div class="lb">${isOpt(item)?OPT:''}${esc(item.label)}${sub?`<small>${esc(sub)}</small>`:''}</div>
   ${item.ppt?`<button class="pptb" data-p="${idx}" title="도형을 수정할 수 있는 PPT 슬라이드로 받기">PPT</button>`:''}<button class="copy" data-i="${idx}">복사</button><button class="more" data-i="${idx}" aria-label="더보기">⋯</button></div></div>`;
}
function bindCards(root,list,apt){
  S.lbList=list;
  root.querySelectorAll('.thumb').forEach(b=>b.onclick=()=>openLB(+b.dataset.i));
  root.querySelectorAll('.copy').forEach(b=>b.onclick=()=>copyImage(apt,list[+b.dataset.i].file,b));
  root.querySelectorAll('.pptb').forEach(b=>b.onclick=()=>downloadSlide(apt,list[+b.dataset.p],b));
  root.querySelectorAll('.more').forEach(b=>b.onclick=e=>{e.stopPropagation();itemMenu(apt,list[+b.dataset.i],b)});
  fillImgs(root,apt);
}

function renderPlans(a){
  const i=a.info,body=$('#tabBody');const types=i.types||[];
  if(!types.length){body.innerHTML=`<p class="nodata">등록된 타입이 없습니다. 타입을 추가하거나, 평면도 이미지를 붙여넣으세요(Ctrl+V).</p><button class="btn" id="btnAddType">＋ 타입 추가</button>`;$('#btnAddType').onclick=()=>addType(a);return}
  if(!types.find(t=>t.name===S.type))S.type=types[0].name;
  const t=types.find(x=>x.name===S.type);
  let h=`<div class="types">${types.map(x=>`<button class="type ${x.name===S.type?'on':''}" data-n="${esc(x.name)}"><span class="sw" style="background:${typeColor(a,x.name)}"></span>${esc(x.name)}${x.households?`<small>${x.households}세대</small>`:''}${x.plans.some(isOpt)?'<small class="opt-s">옵션</small>':''}</button>`).join('')}
    <button class="btn sm ghost" id="btnAddType">＋ 타입</button><button class="btn sm ghost" id="btnTypeMenu">타입 편집</button></div>`;
  const nOpt=t.plans.filter(isOpt).length,nBase=t.plans.length-nOpt;
  if(nOpt&&nBase)h+=`<div class="chips">${[['all','전체',t.plans.length],['base','기본',nBase],['opt','옵션',nOpt]].map(([k,l,c])=>`<button class="chip ${S.pf===k?'on':''}" data-pf="${k}">${l} ${c}</button>`).join('')}</div>`;
  const list=[];const groups={};
  for(const p of t.plans){if(nOpt&&nBase&&((S.pf==='opt'&&!isOpt(p))||(S.pf==='base'&&isOpt(p))))continue;(groups[p.group||'평면도']||(groups[p.group||'평면도']=[])).push(p)}
  const photos=(i.images||[]).filter(x=>x.type===t.name);
  for(const [g,ps] of Object.entries(groups)){h+=`<div class="grp${ps.some(isOpt)?' grp-opt':''}">${ps.some(isOpt)&&!/옵션/.test(g)?OPT:''}${esc(g)}</div><div class="grid">${ps.map(p=>{list.push(p);return cardHTML(a,p,list.length-1,t.name)}).join('')}</div>`}
  if(photos.length){h+=`<div class="grp">${esc(t.name)} 세대 사진</div><div class="grid">${photos.map(p=>{list.push(p);return cardHTML(a,p,list.length-1,p.category)}).join('')}</div>`}
  if(!t.plans.length&&!photos.length)h+=`<p class="nodata">이 타입에 등록된 평면도가 없습니다. 이미지를 붙여넣거나(Ctrl+V) 끌어다 놓으세요.</p>`;
  body.innerHTML=h;
  body.querySelectorAll('.type').forEach(b=>b.onclick=()=>{if(S.type===b.dataset.n)return;S.type=b.dataset.n;S.pf='all';renderPlans(a);pushNav()});
  body.querySelectorAll('[data-pf]').forEach(b=>b.onclick=()=>{S.pf=b.dataset.pf;renderPlans(a)});
  $('#btnAddType').onclick=()=>addType(a);
  $('#btnTypeMenu').onclick=e=>showMenu(e.currentTarget,[['타입 이름·세대수 수정',()=>editType(a,t)],['이 타입 삭제',()=>delType(a,t),'danger']]);
  bindCards(body,list,a);
}

function renderImages(a){
  const i=a.info,body=$('#tabBody');const imgs=i.images||[];
  const cats=['전체',...new Set(imgs.map(x=>x.category||'기타')),...(imgs.some(isOpt)?['옵션']:[])];
  if(!cats.includes(S.cat))S.cat='전체';
  const list=imgs.filter(x=>S.cat==='전체'||(S.cat==='옵션'?isOpt(x):(x.category||'기타')===S.cat));
  let h=`<div class="chips">${cats.map(c=>`<button class="chip ${c===S.cat?'on':''}" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div>`;
  h+=list.length?`<div class="grid">${list.map((p,ix)=>cardHTML(a,p,ix,(p.category||'기타')+(p.type?' · '+p.type:''))).join('')}</div>`:`<p class="nodata">등록된 이미지가 없습니다. 이미지를 붙여넣거나(Ctrl+V) 끌어다 놓으세요.</p>`;
  body.innerHTML=h;
  body.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{S.cat=b.dataset.c;renderImages(a)});
  bindCards(body,list,a);
}

function featText(a){
  const i=a.info;
  return `[${a.name}] ${[a.region,a.sub].filter(Boolean).join(' > ')}\n`+(i.notice?`\n※ ${i.notice}\n`:'')+
   ((i.facts||[]).length?'\n'+i.facts.map(f=>`${f.label}: ${f.value}`).join('\n')+'\n':'')+
   '\n'+(i.features||[]).map(s=>`■ ${s.option?'[옵션] ':''}${s.title}\n${s.text}`).join('\n\n');
}
let featBackup=null;
function renderFeat(a){
  const i=a.info,body=$('#tabBody');
  i.features=i.features||[];
  if(S.edit){
    body.innerHTML=`<div class="editbox">
      <div><label>중요 안내 (상단 형광펜 문구)</label><textarea id="eNotice" rows="2">${esc(i.notice||'')}</textarea></div>
      <div><label>기본 정보 — 한 줄에 하나씩 “항목: 내용”</label><textarea id="eFacts" rows="3">${esc((i.facts||[]).map(f=>f.label+': '+f.value).join('\n'))}</textarea></div>
    </div>
    <div class="feat">${i.features.map((s,ix)=>secEdit(s,ix)).join('')}</div>
    <div style="display:flex;gap:8px;margin-top:16px"><button class="btn" id="eAdd">＋ 항목 추가</button><span style="flex:1"></span><button class="btn" id="eCancel">취소</button><button class="btn pri" id="eSave">적용</button></div>`;
    $('#eAdd').onclick=()=>{collect(a);i.features.push({title:'새 항목',text:''});renderFeat(a)};
    $('#eCancel').onclick=()=>{Object.assign(i,JSON.parse(featBackup));S.edit=false;renderMain()};
    $('#eSave').onclick=()=>{collect(a);S.edit=false;markDirty();renderMain();toast('적용했습니다 — ‘HTML 저장’으로 보관하세요')};
    body.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{collect(a);i.features.splice(+b.dataset.del,1);renderFeat(a)});
    body.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{collect(a);const k=+b.dataset.up;if(k>0)[i.features[k-1],i.features[k]]=[i.features[k],i.features[k-1]];renderFeat(a)});

/* ---------- clipboard ---------- */
async function toPng(blob){
  const bmp=await createImageBitmap(blob);const c=document.createElement('canvas');c.width=bmp.width;c.height=bmp.height;
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(bmp,0,0);
  return await new Promise(r=>c.toBlob(r,'image/png'));
}
async function copyImage(apt,rel,btn){
  try{
    const p=(async()=>toPng(await blobOf(apt,rel)))();
    await navigator.clipboard.write([new ClipboardItem({'image/png':p})]);
    flash(btn,'복사됨');toast('이미지를 복사했습니다 — 카톡·PPT에 붙여넣기(Ctrl+V)');
  }catch(e){toast('복사하지 못했습니다. 엣지·크롬에서 열어 주세요.')}
}
async function copyText(t,btn){try{await navigator.clipboard.writeText(t);flash(btn,'복사됨');toast('텍스트를 복사했습니다')}catch(e){toast('복사하지 못했습니다')}}
function flash(b,m){if(!b)return;const o=b.textContent;b.textContent=m;b.classList.add('done');setTimeout(()=>{b.textContent=o;b.classList.remove('done')},1300)}

/* ---------- PPT (편집 가능한 도형) ---------- */
function saveBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
const fname=s=>s.replace(/[\\/:*?"<>|]/g,'').replace(/\s+/g,'_');
async function downloadDeck(a,d){saveBlob(await blobOf(a,d.file),fname(`${a.name}_${d.label}(편집용).pptx`));toast('PPT를 내려받았습니다 — 도형을 바로 수정할 수 있습니다')}
async function downloadSlide(a,item,btn){
  try{
    if(btn)btn.disabled=true;
    const pf=await blobOf(a,item.ppt);if(!pf){toast('PPT 파일을 찾지 못했습니다');return}
    const zip=await JSZip.loadAsync(pf);
    const P=new DOMParser(),X=new XMLSerializer();
    const presX=P.parseFromString(await zip.file('ppt/presentation.xml').async('string'),'application/xml');
    const relX=P.parseFromString(await zip.file('ppt/_rels/presentation.xml.rels').async('string'),'application/xml');
    const ctX=P.parseFromString(await zip.file('[Content_Types].xml').async('string'),'application/xml');
    const RNS='http://schemas.openxmlformats.org/officeDocument/2006/relationships';
    const ids=[...presX.getElementsByTagName('p:sldId')];
    const rels=[...relX.getElementsByTagName('Relationship')];
    ids.forEach((el,k)=>{
      if(k===item.slide-1)return;
      const rid=el.getAttributeNS(RNS,'id')||el.getAttribute('r:id');
      const rel=rels.find(r=>r.getAttribute('Id')===rid);
      if(rel){const tgt='ppt/'+rel.getAttribute('Target').replace(/^\/?ppt\//,'');
        zip.remove(tgt);zip.remove(tgt.replace(/slides\/(slide\d+\.xml)$/,'slides/_rels/$1.rels'));
        [...ctX.getElementsByTagName('Override')].forEach(o=>{if(o.getAttribute('PartName')==='/'+tgt)o.parentNode.removeChild(o)});
        rel.parentNode.removeChild(rel)}
      el.parentNode.removeChild(el);
    });
    // 구역(section)에 남은 삭제 슬라이드 참조 제거 → 빈 페이지 방지
    const P14='http://schemas.microsoft.com/office/powerpoint/2010/main';
    const keepIds=new Set([...presX.getElementsByTagName('p:sldId')].map(e=>e.getAttribute('id')));
    [...presX.getElementsByTagNameNS(P14,'sldId')].forEach(e=>{if(!keepIds.has(e.getAttribute('id')))e.parentNode.removeChild(e)});
    [...presX.getElementsByTagNameNS(P14,'section')].forEach(sec=>{if(!sec.getElementsByTagNameNS(P14,'sldId').length)sec.parentNode.removeChild(sec)});
    zip.file('docProps/app.xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Properties xmlns="http://schemas.openxmlformats.org/officeDocument/2006/extended-properties" xmlns:vt="http://schemas.openxmlformats.org/officeDocument/2006/docPropsVTypes"><Application>Microsoft Office PowerPoint</Application><Slides>1</Slides><Notes>0</Notes><HiddenSlides>0</HiddenSlides></Properties>');
    const used=new Set();
    for(const f of zip.file(/_rels\/[^/]+\.rels$/)){const t=await f.async('string');(t.match(/media\/[^"]+/g)||[]).forEach(m=>used.add('ppt/'+m))}
    zip.file(/^ppt\/media\//).forEach(f=>{if(!used.has(f.name))zip.remove(f.name)});
    zip.file('ppt/presentation.xml',X.serializeToString(presX));
    zip.file('ppt/_rels/presentation.xml.rels',X.serializeToString(relX));
    zip.file('[Content_Types].xml',X.serializeToString(ctX));
    const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE',mimeType:'application/vnd.openxmlformats-officedocument.presentationml.presentation'});
    const typ=(a.info.types||[]).find(t=>t.plans.includes(item));
    saveBlob(blob,fname(`${a.name}_${typ?typ.name+'_':''}${isOpt(item)?'옵션_':''}${item.label}.pptx`));
    flash(btn,'받음');toast('PPT 슬라이드를 받았습니다 — 열어서 도형 전체 선택(Ctrl+A) 후 복사해 붙여넣으세요');
  }catch(e){console.error(e);toast('PPT를 만들지 못했습니다: '+e.message)}
  finally{if(btn)btn.disabled=false}
}

    if(kind==='plan'){
      let tn=$('#mType').value;if(tn==='__new'){tn=$('#mNewType').value.trim();if(!tn){toast('타입명을 입력하세요');return false}}
      let t=types.find(x=>x.name===tn);if(!t){t={name:tn,households:0,plans:[]};i.types=i.types||[];i.types.push(t)}
      const grp=$('#mGrp').value.trim();
      for(const f of files){const label=nameOf(f,`${tn} 평면도 ${t.plans.length+1}`);const rel=`평면도/${safe(tn)}_${safe(label)}_${uid()}.webp`;await writeFileAt(aptPath(a,rel),await toWebp(f));const o={file:rel,label,group:$('#mOpt').checked&&!/옵션/.test(grp)?'옵션':grp};if($('#mOpt').checked||/옵션/.test(grp))o.option=true;t.plans.push(o)}
      S.type=tn;S.tab='plans';
    }else{
      const cat=$('#mCat').value.trim()||'기타',ty=$('#mImgType').value;i.images=i.images||[];
      for(const f of files){const label=nameOf(f,`${cat} ${i.images.length+1}`);const rel=`이미지/${safe(cat)}_${safe(label)}_${uid()}.webp`;await writeFileAt(aptPath(a,rel),await toWebp(f));const d={file:rel,label,category:cat};if(ty)d.type=ty;if($('#mOpt').checked)d.option=true;i.images.push(d)}
      S.tab='images';
    }
    markDirty();renderMain();toast(`${files.length}장을 폴더에 저장했습니다`);
  });
  const segs=$('#moBox').querySelectorAll('.seg button');
  const setK=k=>{kind=k;segs.forEach(b=>b.classList.toggle('on',b.dataset.k===k));draw()};
  segs.forEach(b=>b.onclick=()=>setK(b.dataset.k));setK(kind);
}
function readyForAdd(){if(!S.root){toast('먼저 자료 폴더를 연결하세요');return false}if(!S.cur||!S.cur.info){toast('먼저 왼쪽에서 아파트를 고르세요');return false}return true}
document.addEventListener('paste',e=>{
  if(e.target.closest('input,textarea')||$('#mo').classList.contains('on'))return;
  const fs=[...(e.clipboardData?.items||[])].filter(x=>x.type.startsWith('image/')).map(x=>x.getAsFile()).filter(Boolean);
  if(!fs.length)return;e.preventDefault();if(readyForAdd())askTarget(S.cur,fs);
});
$('#imgInput').addEventListener('change',e=>{const fs=[...e.target.files];e.target.value='';if(fs.length&&readyForAdd())askTarget(S.cur,fs)});
let dragN=0;
addEventListener('dragenter',e=>{if([...e.dataTransfer.types].includes('Files')&&S.cur&&S.cur.info){dragN++;$('#drop').classList.add('on')}});
addEventListener('dragleave',()=>{dragN=Math.max(0,dragN-1);if(!dragN)$('#drop').classList.remove('on')});
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();dragN=0;$('#drop').classList.remove('on');const fs=[...e.dataTransfer.files].filter(f=>f.type.startsWith('image/'));if(fs.length&&readyForAdd())askTarget(S.cur,fs)});

/* ---------- empty view ---------- */
function emptyView(){
  if(!S.root)return `<div class="empty"><h2>자료 폴더를 연결하세요</h2>
    <p>쉐어포인트에서 동기화한 <b>아파트자료실</b> 폴더를 선택하면 목록이 나옵니다. 한 번 연결하면 다음부터는 자동으로 이어집니다.</p>
    <div class="tree-ex">📁 아파트자료실<br>&nbsp;&nbsp;├ 📄 index.html <span style="color:var(--mute)">(이 앱)</span><br>&nbsp;&nbsp;├ 📄 목록.json · 검색.json<br>&nbsp;&nbsp;└ 📁 자료<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;└ 📁 인천_검단_e편한세상검단웰카운티<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;├ 📄 info.json<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;├ 📁 평면도 · 📁 이미지 · 📁 ppt</div>
    <div class="row"><button class="btn pri" id="eConnect">폴더 연결</button></div>
    ${FSOK?'':'<p style="margin-top:14px;color:var(--danger)">이 브라우저는 폴더 연결을 지원하지 않습니다. <b>엣지</b> 또는 <b>크롬</b>에서 열어 주세요.</p>'}</div>`;
  if(S.noIndex)return `<div class="empty"><h2>목록.json 을 찾지 못했습니다</h2>
    <p>연결한 폴더(<b>${esc(S.rootName)}</b>) 바로 아래에 <code>목록.json</code> 과 <code>자료</code> 폴더가 있어야 합니다. 한 단계 위·아래 폴더를 잘못 고르지 않았는지 확인해 주세요.</p>
    <div class="row"><button class="btn pri" id="eConnect">폴더 다시 선택</button><button class="btn" id="btnAddApt2">＋ 아파트 추가해서 새로 시작</button></div></div>`;
  const n=S.apts.length,regs=[...new Set(S.apts.map(a=>a.region))];
  return `<div class="empty">${(history.state?.d||0)>0?'<button class="back" data-back style="margin-bottom:18px">← 뒤로</button>':''}<button class="btn sm menu-btn" onclick="document.getElementById('side').classList.add('on')" style="margin:0 0 18px 6px">☰ 아파트 목록</button><h2>${n?'왼쪽에서 아파트를 고르세요':'아파트를 추가해 시작하세요'}</h2>
    ${n?`<p>${regs.length}개 지역, ${n}곳이 들어 있습니다. 검색창에 아파트명이나 “실링팬”, “라운드” 같은 특징을 입력해도 찾을 수 있습니다.</p>`:''}
    <p>평면도·이미지는 <b>복사</b> 버튼 한 번으로 카톡·PPT에 바로 붙여넣을 수 있습니다.</p>
    <p>고치거나 추가한 내용은 <b>폴더에 바로 저장</b>됩니다. 따로 내려받을 필요가 없습니다.</p></div>`;
}

/* ---------- init ---------- */
$('.brand h1').onclick=goHome;$('.brand h1').style.cursor='pointer';$('.brand h1').title='처음 화면';
document.querySelector('.side-close').onclick=()=>$('#side').classList.remove('on');
renderConn();renderTree();renderMain();
(async()=>{
  if(!FSOK)return;
  const h=await kvGet('root');
  if(!h)return;
  try{
    if(await h.queryPermission({mode:'readwrite'})==='granted'){await useRoot(h);return}
    S.saved=h;
    $('#conn').innerHTML=`<span class="dot"></span><div style="flex:1;min-width:0">폴더 권한 필요<b>${esc(h.name)}</b></div><button class="btn sm pri" id="cBtn">열기</button>`;
    $('#cBtn').onclick=()=>useRoot(h);
  }catch(e){}
})();
</script>
</body>
